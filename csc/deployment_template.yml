apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${CSC_PROJECT}/turva-back
  labels:
    app: ${CSC_PROJECT}/turva-back
spec:
  selector:
    matchLabels:
      app: ${CSC_PROJECT}/turva-back
  template:
    metadata:
      labels:
        app: ${CSC_PROJECT}/turva-back
    spec:
      containers:
        - name: ${CSC_PROJECT}/turva-back
          image: image-registry.openshift-image-registry.svc:5000/${CSC_PROJECT}/turva-back:${COMMIT_SHA}
          ports:
            - containerPort: 3000
              name: http
  replicas: 1
  strategy:
    type: RollingUpdate
  paused: false
  revisionHistoryLimit: 5
  minReadySeconds: 0
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ${CSC_PROJECT}/turva-back
  name: ${CSC_PROJECT}/turva-back
spec:
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: ${CSC_PROJECT}/turva-back
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: ${CSC_PROJECT}/turva-back
  name: ${CSC_PROJECT}/turva-back
spec:
  to:
    kind: Service
    name: ${CSC_PROJECT}/turva-back
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

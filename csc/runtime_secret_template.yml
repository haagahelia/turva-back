# This template is intentionally not used by the deployment workflow.
# GitHub Actions creates the secret with `oc create secret generic --from-env-file`
# so values containing YAML-special characters are preserved safely.
apiVersion: v1
kind: Secret
metadata:
  name: turva-back-secrets
type: Opaque
stringData:
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: ${POSTGRES_HOST}
  JWT_SECRET: ${JWT_SECRET}
  TEST_DOMAIN: ${TEST_DOMAIN}
